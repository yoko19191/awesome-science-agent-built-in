package_rationale: >
  Kept as its own skill rather than folded into screen-hit-triage-interference: the two answer
  different questions. This skill assumes the potency is real and organises it into series for
  expansion; that one judges whether the signal is an assay artefact. They compose in sequence.

known_risks:
  - "Auto-selection picks the best-resolution ligand-bound structure, which is not always the most RELEVANT one. It cannot reason about which domain or conformational state a series targets. For allosteric series or pseudokinase domains, pass --pdb-id explicitly."
  - "Docking scores rank poses; they do not predict potency. The docking-vs-pChEMBL correlation must be reported honestly even when poor or absent (EGFR run: r=0.076, p=0.612, not significant)."
  - "Series membership is a clustering result at a chosen Tanimoto cutoff, not a chemotype truth."
  - "The per-series activity-cliff flag is coarse. Cliff counts swing by an order of magnitude with the similarity criterion (0.13% Tanimoto-only vs 6.04% consensus on one dataset), so quantitative cliff work belongs to matched-molecular-pairs."
  - "PDB auto-selection depends on live RCSB APIs. Network degradation surfaces as an explicit failure telling the caller to pass --pdb-id, never as a silent fallback."
  - "receptor_variant is best-effort: RCSB pdbx_mutation can list engineered/crystallisation mutations rather than the disease variant, and mutation_count==0 is reported as WT. Declare it explicitly with --receptor-variant when the biological variant matters."
  - "Default scoring still POOLS variants (--variant any) -- this is now visible (composition + warning + per-compound variant column), not silent, and can be restricted with --variant, but a caller who ignores the warning still gets variant-pooled tiers."
  - "Meeko receptor preparation failed at runtime (empty error) in the EGFR run and the workflow fell back to ADFR prepare_receptor (LGPL2, verified at https://ccsb.scripps.edu/adfr/license/), the documented commercial-safe fallback. Degradation was graceful, but the Meeko receptor path did not work in this environment."
  - "The scripts write outputs to the run dir; a publish step copies the HTML/PDF/CSVs/figures to /mnt/results. The SKILL.md Outputs table describes the delivered files, not the scripts' working dir."
  - "Coverage is partial even on a passing run: the user-supplied-CSV entry path, the include_bounds relation filter, the no-co-crystal-ligand branch, the MCS-failure fallback and docking-timeout handling were not exercised in the EGFR run."
  - "Non-interference items from the original review that were NOT in scope remain with the skill owner if any resurface."
